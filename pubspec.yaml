name: kryonex_address_picker
description: An opinionated, search-first address picker for Flutter with Nominatim geocoding, map confirmation, and structured address output. Built with ForUI components and flutter_map.
version: 0.0.4
homepage: https://github.com/Kryonex-Labs/kryonex_address_picker
documentation: https://pub.dev/documentation/kryonex_address_picker/latest/

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  forui: ^0.22.1
  flutter_hooks: ^0.20.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.0
  geolocator_platform_interface: ^4.2.6
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
