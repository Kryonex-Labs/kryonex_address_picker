name: Publish to pub.dev

on:
  push:
    tags:
      - 'v_[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    environment: pub.dev
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dart-lang/setup-dart@v1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --force
